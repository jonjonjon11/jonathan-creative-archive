<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hydrogen Replay Lesson</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #070c1a; color: #e5e7eb; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 12px; }
    .grid { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
    .panel { border: 1px solid #334155; border-radius: 10px; padding: 10px; background: #111827; }
    .controls { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    input, select, button { width: 100%; background: #0f172a; color: #e5e7eb; border: 1px solid #334155; border-radius: 6px; padding: 6px; }
    canvas { width: 100%; border: 1px solid #334155; border-radius: 8px; image-rendering: pixelated; }
    .legend { font-size: 12px; color: #93c5fd; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <p><a href="./index.html" style="color:#93c5fd;">← Back to Atom Explorer</a></p>
    <h1>Same Starting Frame: Hydrogen Replay</h1>
    <p class="legend">
      Baseline starts with 1s vs 1s. Change only the right side to 2p(z), compare at identical slice and scale, scrub time, and replay.
    </p>

    <div class="panel">
      <div class="controls">
        <label>Left state
          <select id="leftState">
            <option value="1s">Hydrogen 1s</option>
          </select>
        </label>
        <label>Right state
          <select id="rightState">
            <option value="1s">Hydrogen 1s</option>
            <option value="2pz">Hydrogen 2p(z)</option>
          </select>
        </label>
        <label>Slice plane z
          <input id="sliceZ" type="range" min="-3" max="3" step="0.05" value="0" />
        </label>
        <label>Display scale
          <input id="displayScale" type="range" min="0.5" max="4" step="0.1" value="1.5" />
        </label>
        <label>Timescale
          <input id="timescale" type="range" min="0" max="300" step="1" value="100" />
        </label>
      </div>
      <div class="controls" style="margin-top:8px;">
        <button id="pause">Pause</button>
        <button id="step">Step +0.05s</button>
        <button id="saveCmp">Save comparison</button>
        <button id="restoreCmp">Restore saved</button>
        <button id="reset">Reset baseline</button>
      </div>
      <p id="status" class="legend"></p>
    </div>

    <div class="grid">
      <div class="panel">
        <h2>Left</h2>
        <canvas id="leftCanvas" width="420" height="420"></canvas>
      </div>
      <div class="panel">
        <h2>Right</h2>
        <canvas id="rightCanvas" width="420" height="420"></canvas>
      </div>
    </div>
  </div>

  <script type="module">
    import { createPlayback } from "../common/playback.js";

    const playback = createPlayback(1);
    const leftState = document.getElementById("leftState");
    const rightState = document.getElementById("rightState");
    const sliceZ = document.getElementById("sliceZ");
    const displayScale = document.getElementById("displayScale");
    const timescale = document.getElementById("timescale");
    const pauseBtn = document.getElementById("pause");
    const stepBtn = document.getElementById("step");
    const saveBtn = document.getElementById("saveCmp");
    const restoreBtn = document.getElementById("restoreCmp");
    const resetBtn = document.getElementById("reset");
    const status = document.getElementById("status");

    const leftCtx = document.getElementById("leftCanvas").getContext("2d");
    const rightCtx = document.getElementById("rightCanvas").getContext("2d");
    const savedKey = "hcrp-hydrogen-comparison-v1";

    function psi1s(x, y, z) {
      const r = Math.sqrt(x*x + y*y + z*z);
      return Math.exp(-r);
    }
    function psi2pz(x, y, z) {
      const r = Math.sqrt(x*x + y*y + z*z) + 1e-9;
      return z * Math.exp(-r / 2);
    }
    function density(state, x, y, z) {
      const psi = state === "2pz" ? psi2pz(x, y, z) : psi1s(x, y, z);
      return psi * psi;
    }

    function drawDensity(ctx, state, zSlice, scale) {
      const { width, height } = ctx.canvas;
      const img = ctx.createImageData(width, height);
      const range = 3 / scale;
      let maxD = 1e-6;

      const vals = new Float32Array(width * height);
      let i = 0;
      for (let y = 0; y < height; y++) {
        const ny = ((y / (height - 1)) * 2 - 1) * range;
        for (let x = 0; x < width; x++) {
          const nx = ((x / (width - 1)) * 2 - 1) * range;
          const d = density(state, nx, ny, zSlice);
          vals[i++] = d;
          if (d > maxD) maxD = d;
        }
      }

      for (let p = 0; p < vals.length; p++) {
        const v = Math.min(1, vals[p] / maxD);
        const idx = p * 4;
        img.data[idx] = Math.round(20 + 180 * v);
        img.data[idx + 1] = Math.round(120 + 110 * v);
        img.data[idx + 2] = Math.round(255 * v);
        img.data[idx + 3] = Math.round(255 * Math.pow(v, 0.7));
      }
      ctx.putImageData(img, 0, 0);

      ctx.strokeStyle = "#22d3ee";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, height / 2);
      ctx.lineTo(width, height / 2);
      ctx.moveTo(width / 2, 0);
      ctx.lineTo(width / 2, height);
      ctx.stroke();
    }

    function baseline() {
      leftState.value = "1s";
      rightState.value = "1s";
      sliceZ.value = "0";
      displayScale.value = "1.5";
      timescale.value = "100";
      playback.reset();
      render();
    }

    function saveComparison() {
      const cmp = {
        left: leftState.value,
        right: rightState.value,
        z: Number(sliceZ.value),
        scale: Number(displayScale.value),
        speed: Number(timescale.value),
        t: playback.time
      };
      localStorage.setItem(savedKey, JSON.stringify(cmp));
      render();
    }

    function restoreComparison() {
      const raw = localStorage.getItem(savedKey);
      if (!raw) return;
      try {
        const cmp = JSON.parse(raw);
        leftState.value = cmp.left || "1s";
        rightState.value = cmp.right || "1s";
        sliceZ.value = String(cmp.z ?? 0);
        displayScale.value = String(cmp.scale ?? 1.5);
        timescale.value = String(cmp.speed ?? 100);
      } catch {}
      render();
    }

    function render() {
      const z = Number(sliceZ.value);
      const scale = Number(displayScale.value);
      const speed = Number(timescale.value) / 100;
      playback.setSpeed(speed);
      drawDensity(leftCtx, leftState.value, z, scale);
      drawDensity(rightCtx, rightState.value, z, scale);

      const nodeText = Math.abs(z) < 0.0001 && rightState.value === "2pz"
        ? "At z=0, 2p(z) density is zero across the xy plane (node)."
        : "Move z away from 0 to observe nonzero 2p(z) density.";
      const stationaryText = "Hydrogen stationary densities hold shape while time scrubs (time is playback/context only).";
      const saved = localStorage.getItem(savedKey) ? "Saved comparison: available." : "Saved comparison: none.";
      status.textContent = `${nodeText} ${stationaryText} ${saved}`;
    }

    leftState.addEventListener("change", render);
    rightState.addEventListener("change", render);
    sliceZ.addEventListener("input", render);
    displayScale.addEventListener("input", render);
    timescale.addEventListener("input", render);
    pauseBtn.addEventListener("click", () => {
      playback.togglePause();
      pauseBtn.textContent = playback.paused ? "Play" : "Pause";
      render();
    });
    stepBtn.addEventListener("click", () => {
      playback.setSpeed(0);
      for (let i = 0; i < 3; i++) playback.tick();
      render();
    });
    saveBtn.addEventListener("click", saveComparison);
    restoreBtn.addEventListener("click", restoreComparison);
    resetBtn.addEventListener("click", baseline);

    function loop() {
      playback.tick();
      if (!playback.paused) render();
      requestAnimationFrame(loop);
    }

    baseline();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
