<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jet Engine Concept Viewer</title>
  <style>
    body { margin: 0; background: #0a0f1c; color: #e2e8f0; font-family: Arial, sans-serif; overflow: hidden; }
    #ui {
      position: fixed; top: 10px; left: 10px; z-index: 20; width: 320px;
      background: rgba(10, 15, 30, 0.88); border: 1px solid #334155; border-radius: 8px; padding: 10px;
    }
    #ui label { display: block; margin: 8px 0 3px; font-size: 12px; color: #cbd5e1; }
    #ui input { width: 100%; }
    #ui .row { display: flex; gap: 8px; margin-top: 8px; }
    #ui button { flex: 1; padding: 6px; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; }
    #legend { font-size: 12px; color: #93c5fd; margin-top: 8px; line-height: 1.35; }
  </style>
</head>
<body>
  <div id="ui">
    <label for="flow">Flow speed</label>
    <input id="flow" type="range" min="0" max="300" value="120" />

    <label for="timescale">Timescale</label>
    <input id="timescale" type="range" min="0" max="500" value="100" />

    <label for="cutaway">Cutaway (x clip plane)</label>
    <input id="cutaway" type="range" min="-18" max="18" value="18" />

    <label for="opacity">Shell transparency</label>
    <input id="opacity" type="range" min="15" max="100" value="65" />

    <div class="row">
      <button id="toggleLP">LP stage</button>
      <button id="toggleHP">HP stage</button>
      <button id="toggleComb">Combustor</button>
    </div>
    <div class="row">
      <button id="pause">Pause</button>
      <button id="reset">Reset</button>
    </div>

    <div id="legend">
      Educational concept visualization only (not certified engineering CFD/FEA).
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.162.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.162.0/examples/jsm/controls/OrbitControls.js";

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.localClippingEnabled = true;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#0a0f1c");

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(28, 14, 28);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const key = new THREE.DirectionalLight(0xffffff, 1.2);
    key.position.set(18, 24, 16);
    scene.add(key);

    const cutPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 18);
    renderer.clippingPlanes = [cutPlane];

    function mat(color, opacity = 1, transparent = false) {
      return new THREE.MeshStandardMaterial({
        color, opacity, transparent, roughness: 0.35, metalness: 0.25, clippingPlanes: [cutPlane]
      });
    }

    const engine = new THREE.Group();
    scene.add(engine);

    const casing = new THREE.Mesh(
      new THREE.CylinderGeometry(5.8, 4.8, 34, 64, 1, true),
      mat("#94a3b8", 0.65, true)
    );
    casing.rotation.z = Math.PI / 2;
    engine.add(casing);

    const coreAxis = new THREE.Mesh(
      new THREE.CylinderGeometry(0.45, 0.45, 34, 24),
      mat("#38bdf8")
    );
    coreAxis.rotation.z = Math.PI / 2;
    engine.add(coreAxis);

    const lpGroup = new THREE.Group();
    const hpGroup = new THREE.Group();
    const combGroup = new THREE.Group();
    engine.add(lpGroup, hpGroup, combGroup);

    function addBladeDisc(group, x, radius, color) {
      const disc = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, 0.5, 36), mat(color));
      disc.rotation.z = Math.PI / 2;
      disc.position.x = x;
      group.add(disc);

      for (let i = 0; i < 22; i++) {
        const blade = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.08, 1.5), mat(color));
        const a = (i / 22) * Math.PI * 2;
        blade.position.set(x, Math.cos(a) * (radius - 0.65), Math.sin(a) * (radius - 0.65));
        blade.lookAt(x, 0, 0);
        group.add(blade);
      }
    }

    addBladeDisc(lpGroup, -9, 4.7, "#60a5fa");
    addBladeDisc(lpGroup, -6.7, 4.3, "#60a5fa");
    addBladeDisc(hpGroup, -1.5, 3.0, "#22d3ee");
    addBladeDisc(hpGroup, 0.8, 2.7, "#22d3ee");
    addBladeDisc(hpGroup, 3.1, 2.5, "#22d3ee");

    const combustor = new THREE.Mesh(
      new THREE.CylinderGeometry(2.7, 2.2, 4.2, 28, 1, true),
      mat("#f59e0b", 0.8, true)
    );
    combustor.rotation.z = Math.PI / 2;
    combustor.position.x = 7;
    combGroup.add(combustor);

    const flowParticles = [];
    for (let i = 0; i < 180; i++) {
      const p = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), mat("#93c5fd"));
      p.position.set(-16 + Math.random() * 32, (Math.random() - 0.5) * 6.5, (Math.random() - 0.5) * 6.5);
      flowParticles.push(p);
      engine.add(p);
    }

    let paused = false;
    const flowEl = document.getElementById("flow");
    const tsEl = document.getElementById("timescale");
    const cutEl = document.getElementById("cutaway");
    const opacityEl = document.getElementById("opacity");

    document.getElementById("toggleLP").onclick = () => { lpGroup.visible = !lpGroup.visible; };
    document.getElementById("toggleHP").onclick = () => { hpGroup.visible = !hpGroup.visible; };
    document.getElementById("toggleComb").onclick = () => { combGroup.visible = !combGroup.visible; };
    document.getElementById("pause").onclick = (e) => {
      paused = !paused;
      e.target.textContent = paused ? "Play" : "Pause";
    };
    document.getElementById("reset").onclick = () => {
      controls.reset();
      camera.position.set(28, 14, 28);
      cutEl.value = "18";
      cutPlane.constant = 18;
      flowEl.value = "120";
      tsEl.value = "100";
    };

    cutEl.addEventListener("input", () => { cutPlane.constant = Number(cutEl.value); });
    opacityEl.addEventListener("input", () => {
      const o = Number(opacityEl.value) / 100;
      casing.material.opacity = o;
      combustor.material.opacity = Math.min(1, o + 0.2);
    });

    const clock = new THREE.Clock();
    function animate() {
      const dt = clock.getDelta();
      const speedScale = Number(tsEl.value) / 100;
      const flowSpeed = Number(flowEl.value) / 100;

      if (!paused) {
        lpGroup.rotation.x += dt * 2.6 * speedScale;
        hpGroup.rotation.x += dt * 4.2 * speedScale;

        for (const p of flowParticles) {
          p.position.x += dt * (3.0 + flowSpeed * 6.5) * speedScale;
          p.position.y += Math.sin(p.position.x * 0.8) * 0.002 * speedScale;
          if (p.position.x > 16) {
            p.position.x = -16;
            p.position.y = (Math.random() - 0.5) * 6.2;
            p.position.z = (Math.random() - 0.5) * 6.2;
          }
        }
      }

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
