name: Knowledge Commons Status

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Knowledge Commons records
        run: |
          python3 tools/validate.py module data/modules.json data/modules/*.json
          python3 tools/validate.py project data/projects/*.json
          python3 tools/validate.py task data/tasks/*.json
      - name: Run offline Python suites
        run: |
          python3 -B -m unittest discover -s tools/tests -p 'test_*.py'
          python3 -B -m unittest discover -s tests -p 'test_*lesson.py'
          python3 -B -m unittest discover -s tools/switch-input-lab/tests -p 'test_*.py'
          python3 -B -m unittest discover -s artifacts/cooperation-rescue -p 'test_*.py'
          python3 -B -m unittest discover -s tools/archive-steward/tests -p 'test_*.py'
          python3 -B -m unittest discover -s tools/idea-finder/tests -p 'test_*.py'
          python3 -B -m unittest discover -s tools/evidence-integrity-audit/tests -p 'test_*.py'
          python3 -B -m unittest discover -s research/als_evidence_map_2026-11-07/tests -p 'test_*.py'
      - name: Run numerical and simulated-control Node suites
        run: |
          node --test tools/lumen-commons/tests/*.test.cjs tools/motion-trace-shape/tests/*.test.cjs tools/water-survey-preflight/tests/*.test.cjs tools/universal-color-ontology/upstream/packages/*/test/*.test.mjs
          node scripts/check_reality_core.cjs
      - name: Check source and standalone parity
        run: |
          python3 tools/lumen-commons/tests/static_check.py
          python3 tools/motion-trace-shape/tests/static_check.py
          python3 artifacts/cooperation-rescue/contract.py
          node tools/water-survey-preflight/build.cjs --check
      - name: Validate evidence map and exact generated views
        run: |
          python3 research/als_evidence_map_2026-11-07/tools/validate.py
          python3 research/als_evidence_map_2026-11-07/tools/render.py --check
          (cd research/als_evidence_map_2026-11-07 && sha256sum -c MANIFEST.sha256)
          python3 -B tools/evidence-integrity-audit/audit.py --repo tools/evidence-integrity-audit/fixtures/clean-synthetic
      - name: Validate archive structure and reviewed checksums
        run: |
          python3 scripts/validate_archive.py
          python3 tools/archive-steward/archive_steward.py .
          git diff --check
          git diff --exit-code

  motion-browser:
    name: Motion browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned browser test tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Test both offline motion-lab editions
        run: |
          python tools/motion-trace-shape/tests/browser_smoke.py \
            --browser ${{ matrix.browser }} \
            --screenshots "$RUNNER_TEMP/motion-browser/screenshots" \
            --report "$RUNNER_TEMP/motion-browser/report.json"
      - name: Preserve scoped browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-browser-${{ matrix.browser }}
          path: ${{ runner.temp }}/motion-browser
          if-no-files-found: ignore
          retention-days: 7

  lumen-browser:
    name: Lumen browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned browser test tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Test isolated offline Lumen standalone
        run: |
          python tools/lumen-commons/tests/standalone_browser.py \
            --browser ${{ matrix.browser }} \
            --screenshots "$RUNNER_TEMP/lumen-browser/screenshots" \
            --report "$RUNNER_TEMP/lumen-browser/report.json"
      - name: Preserve scoped browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-browser-${{ matrix.browser }}
          path: ${{ runner.temp }}/lumen-browser
          if-no-files-found: ignore
          retention-days: 7

  water-browser:
    name: Water browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tools outside the archive
        run: |
          npm install --prefix "$RUNNER_TEMP/water-playwright" --no-audit --no-fund playwright@1.56.0
          "$RUNNER_TEMP/water-playwright/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Test isolated offline Water standalone with synthetic data
        env:
          WATER_BROWSER: ${{ matrix.browser }}
          WATER_QA_DIR: ${{ runner.temp }}/water-browser-${{ matrix.browser }}
        run: |
          node tools/water-survey-preflight/build.cjs --check
          NODE_PATH="$RUNNER_TEMP/water-playwright/node_modules" node tools/water-survey-preflight/tests/browser.cjs
      - name: Preserve scoped browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-browser-${{ matrix.browser }}
          path: ${{ runner.temp }}/water-browser-${{ matrix.browser }}
          if-no-files-found: ignore
          retention-days: 7

  reality-atlas-browser:
    name: Reality Atlas browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned browser test tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Verify unchanged offline Reality Atlas with recorded software renderer
        run: |
          xvfb-run -a python tools/reality-atlas/tests/browser_smoke.py \
            --browser ${{ matrix.browser }} \
            --output "$RUNNER_TEMP/reality-atlas-browser"
      - name: Preserve scoped browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-atlas-browser-${{ matrix.browser }}
          path: ${{ runner.temp }}/reality-atlas-browser
          if-no-files-found: ignore
          retention-days: 7

  water-input-diagnostics:
    name: Water input diagnostics (${{ matrix.browser }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/dot/water-input-investigation'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test tools outside the archive
        run: |
          npm install --prefix "$RUNNER_TEMP/water-playwright" --no-audit --no-fund playwright@1.56.0
          "$RUNNER_TEMP/water-playwright/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Observe bounded synthetic input paths with external watchdogs
        env:
          WATER_BROWSER: ${{ matrix.browser }}
          WATER_INPUT_QA_DIR: ${{ runner.temp }}/water-input-${{ matrix.browser }}
        run: NODE_PATH="$RUNNER_TEMP/water-playwright/node_modules" node tools/water-survey-preflight/tests/input-diagnostics.cjs
      - name: Preserve observations, including timeouts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-input-${{ matrix.browser }}
          path: ${{ runner.temp }}/water-input-${{ matrix.browser }}
          if-no-files-found: error
          retention-days: 7
