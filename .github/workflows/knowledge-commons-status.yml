name: Knowledge Commons Status

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Validate Knowledge Commons modules
        run: python3 tools/validate.py module data/modules.json
      
      - name: Validate projects
        run: python3 tools/validate.py project data/projects/*.json
      
      - name: Validate tasks
        run: python3 tools/validate.py task data/tasks/*.json

      - name: Validate embedded medical evidence
        run: |
          python3 tools/evidence-library/evidence_library.py data/health/als-evidence.json validate
          python3 tools/evidence-library/evidence_library.py data/health/cancer-foundations.json validate

      - name: Test evidence library
        run: python3 -m unittest discover -s tools/evidence-library/tests -p 'test_*.py' -v

      - name: Test sampled switch-input lab
        run: python3 -m unittest discover -s tools/switch-input-lab/tests -p 'test_*.py' -v

      - name: Check committed science data and offline examples
        run: python3 -m unittest discover -s tests -p 'test_health_foundations.py' -v
